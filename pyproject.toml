[project]
name = "agent-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.9",
    "bcrypt>=5.0.0",
    "langchain-core>=1.0",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-postgres>=3.1.2",
    "langchain-ollama>=1.1.0",
    "psycopg[binary]>=3.3.6",
    "opentelemetry-exporter-otlp-proto-grpc>=1.45.0",
    "opentelemetry-api>=1.45.0",
    "opentelemetry-sdk>=1.45.0",
    "opentelemetry-instrumentation-fastapi>=0.66b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b0",
    "opentelemetry-instrumentation-httpx>=0.66b0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.uv]


[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"  # <- Добавьте/измените эту строку!
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"

